# nginx site config — полимерка-54.рф (punycode: xn---54-5cdyrpfkrkr.xn--p1ai)
#
# Serves the static site AND reverse-proxies Supabase through this domain, because
# *.supabase.co is unreliable/blocked from some RU networks:
#   /sb/...           -> chpb-site Supabase (auth, rest, storage)  [bwokcgmrnrugnrlfprzb]
#   /api/lead-intake  -> CRM lead-intake edge function             [fwsrmodnfuuidzvwlfog]
#
# Apply:
#   sudo tee /etc/nginx/sites-available/chpb < this file
#   sudo nginx -t && sudo systemctl reload nginx
# (TLS lines below assume the certbot cert already issued for this domain.)

server {
    listen 80;
    listen [::]:80;
    server_name xn---54-5cdyrpfkrkr.xn--p1ai www.xn---54-5cdyrpfkrkr.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn---54-5cdyrpfkrkr.xn--p1ai www.xn---54-5cdyrpfkrkr.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn---54-5cdyrpfkrkr.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn---54-5cdyrpfkrkr.xn--p1ai/privkey.pem;

    root /var/www/chpb;
    index index.html;

    # DNS resolver so the Supabase hostnames below are re-resolved at runtime
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    # Lead form -> CRM (crm-v3) edge function
    location = /api/lead-intake {
        set $crm fwsrmodnfuuidzvwlfog.supabase.co;
        proxy_pass https://$crm/functions/v1/lead-intake$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $crm;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Admin / content / storage -> chpb-site Supabase
    location ~ ^/sb/(.*)$ {
        set $sb bwokcgmrnrugnrlfprzb.supabase.co;
        proxy_pass https://$sb/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $sb;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets (content-hashed) — cache hard
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (client routes like /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
