# nginx site config — полимерка-54.рф
# (IDN punycode: xn---54-5cdyrpfkrkr.xn--p1ai)
#
# 1. Скопировать в /etc/nginx/sites-available/chpb
# 2. ln -s /etc/nginx/sites-available/chpb /etc/nginx/sites-enabled/chpb
# 3. rm -f /etc/nginx/sites-enabled/default
# 4. nginx -t && systemctl reload nginx
# 5. certbot --nginx -d xn---54-5cdyrpfkrkr.xn--p1ai -d www.xn---54-5cdyrpfkrkr.xn--p1ai
#    (certbot сам допишет в этот файл блок 443 + редирект на HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name xn---54-5cdyrpfkrkr.xn--p1ai www.xn---54-5cdyrpfkrkr.xn--p1ai;

    root /var/www/chpb;
    index index.html;

    # Ассеты с хэшем в имени — кэшируем надолго
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML-вход держим свежим, чтобы обновления подхватывались сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback: клиентские маршруты (например, /admin) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
